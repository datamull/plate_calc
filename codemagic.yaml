workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "SebaHalt" # nombre de tu integración en Codemagic
    environment:
      groups:
        - app_store_credentials # APP_STORE_CONNECT_PRIVATE_KEY, KEY_ID, ISSUER_ID
      vars:
        BUNDLE_ID: "com.seba.haltercalc"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: flutter pub get

      # Si el análisis o alguna prueba falla, la build se detiene y no se
      # sube nada a TestFlight.
      - name: Análisis estático
        script: flutter analyze
      - name: Pruebas
        script: flutter test

      - name: Firma de código
        script: xcode-project use-profiles --export-method app-store

      # Una sola compilación (antes se compilaba dos veces).
      # El número de build se toma de Codemagic ($BUILD_NUMBER) para que
      # cada subida sea distinta; App Store rechaza números repetidos.
      - name: Compilar IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
