workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nombre de la clave de App Store Connect en Codemagic
      # (Ajustes de la cuenta → Integrations → Developer Portal).
      app_store_connect: "SebaHalt"
    environment:
      # Firma automática: Codemagic obtiene el certificado y el perfil de
      # distribución con la clave de App Store Connect.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.example.plateCalc
      vars:
        BUNDLE_ID: "com.example.plateCalc"
        XCODE_SCHEME: "Runner"
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: flutter pub get

      # Si el análisis o alguna prueba falla, la build se detiene y no se
      # sube nada a TestFlight.
      - name: Análisis estático
        script: flutter analyze
      - name: Pruebas
        script: flutter test

      - name: Firma de código
        script: xcode-project use-profiles

      # Una sola compilación (antes se compilaba dos veces).
      # El número de build se toma de Codemagic ($BUILD_NUMBER) para que
      # cada subida sea distinta; App Store rechaza números repetidos.
      - name: Compilar IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Las builds llegan a TestFlight para testers internos sin revisión.
        # Para testers externos: completar "Test information" en App Store
        # Connect y cambiar a true.
        submit_to_testflight: false
