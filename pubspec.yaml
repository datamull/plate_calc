name: plate_calc
description: "Calculadora de discos para halterofilia y powerlifting."
publish_to: 'none'

# version: <nombre visible>+<número de build>
# En iOS el nombre es CFBundleShortVersionString y el build es CFBundleVersion.
# Codemagic reemplaza el número de build automáticamente (ver codemagic.yaml).
version: 3.0.1+1

environment:
  sdk: ^3.9.2

dependencies:
  file_picker: ^13.3.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  intl: any # versión fijada por flutter_localizations
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorBold
      fonts:
        - asset: assets/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
